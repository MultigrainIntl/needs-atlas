name: Deploy site to Firebase Hosting

# Publishes the web/ folder to Firebase Hosting (needs-atlas.web.app).
# Runs when the site or its data changes, after each "Build Atlas data" run,
# or on demand. Requires one repo secret: FIREBASE_SERVICE_ACCOUNT
# (a Firebase service-account JSON — see web/README-deploy.md).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Build Atlas data"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: needs-atlas
          channelId: live
